<svg width="320" height="400" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone body -->
  <rect x="60" y="20" width="200" height="360" rx="28" fill="#0B1F4B"/>
  <rect x="68" y="52" width="184" height="296" rx="4" fill="#F3F5F8"/>
  <!-- Notch -->
  <rect x="120" y="28" width="80" height="20" rx="10" fill="#1a3366"/>
  <!-- Screen content lines -->
  <rect x="88" y="80" width="80" height="8" rx="4" fill="#c7d0de"/>
  <rect x="88" y="100" width="144" height="6" rx="3" fill="#dde3ec"/>
  <rect x="88" y="116" width="120" height="6" rx="3" fill="#dde3ec"/>
  <!-- Card on screen -->
  <rect x="88" y="140" width="144" height="80" rx="8" fill="#fff" stroke="#dde3ec" stroke-width="1"/>
  <rect x="100" y="156" width="60" height="6" rx="3" fill="#c7d0de"/>
  <rect x="100" y="172" width="100" height="6" rx="3" fill="#dde3ec"/>
  <rect x="100" y="188" width="80" height="6" rx="3" fill="#dde3ec"/>
  <!-- Grade chip -->
  <rect x="100" y="204" width="36" height="14" rx="7" fill="#dcfce7"/>
  <text x="108" y="214" font-size="8" font-weight="600" fill="#166534" font-family="system-ui">A</text>
  <!-- Another card -->
  <rect x="88" y="240" width="144" height="60" rx="8" fill="#fff" stroke="#dde3ec" stroke-width="1"/>
  <rect x="100" y="256" width="80" height="6" rx="3" fill="#c7d0de"/>
  <rect x="100" y="272" width="60" height="6" rx="3" fill="#dde3ec"/>
  <!-- Bottom bar -->
  <rect x="88" y="316" width="144" height="8" rx="4" fill="#c7d0de"/>
  <!-- Home indicator -->
  <rect x="130" y="362" width="60" height="4" rx="2" fill="#1a3366"/>
</svg>
