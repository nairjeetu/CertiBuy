name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (domain)
        run: pnpm --filter @certibuy/domain typecheck

      - name: Typecheck (contracts)
        run: pnpm --filter @certibuy/contracts typecheck

      - name: Test (domain)
        run: pnpm --filter @certibuy/domain test

  rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certibuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/certibuy_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/certibuy_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @certibuy/db db:deploy

      - name: Setup CI database (authenticated role + RLS policies)
        run: pnpm --filter @certibuy/db db:setup-ci

      - name: Seed CI data
        run: pnpm --filter @certibuy/db db:seed-ci

      - name: Test (RLS policies)
        run: pnpm --filter @certibuy/db test
